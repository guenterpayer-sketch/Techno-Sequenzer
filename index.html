<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Techno Sequenzer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Techno Sequenzer</h1>
  <div class="transport">
    <button id="play" class="primary" aria-label="Abspielen">▶ Start</button>
    <label>BPM <input id="bpm" type="number" min="60" max="200" value="138"></label>
    <label>Swing <input id="swing" type="range" min="0" max="50" value="0"></label>
    <label>Master <input id="master" type="range" min="0" max="100" value="80"></label>
    <select id="preset" aria-label="Preset"></select>
    <button id="clear">Leeren</button>
    <button id="export">WAV exportieren</button>
  </div>
</header>
<main>
  <div id="grid" role="grid"></div>
  <p class="hint">Klick auf einen Step: an → Akzent → aus. Änderungen wirken sofort im laufenden Loop.</p>
</main>
<script src="js/engine.js"></script>
<script src="js/sequencer.js"></script>
<script src="js/presets.js"></script>
<script src="js/app.js"></script>
</body>
</html>
